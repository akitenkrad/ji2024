[project]
name = "ji2024-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "srap-tools",
]

[tool.uv.workspace]
members = ["tools"]

[tool.uv.sources]
srap-tools = { workspace = true }
# run ディレクトリの読み書きの正本は rs-runvault にある．path 依存にすると
# 開発機のディレクトリ配置に縛られるので git 依存にする．
runvault = { git = "https://github.com/akitenkrad/rs-runvault", subdirectory = "python" }
